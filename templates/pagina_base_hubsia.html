<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Hubsia{% endblock %}</title>
  <link rel="stylesheet" href="/static/estilos_comparador_agregadores.css?v=6">
</head>
<body>
  <header class="topo">
    <a class="marca" href="/">Hubsia</a>
    <nav class="acoes">
      <a href="/">Comparações</a>
      <form method="post" action="/logout">
        <button class="botao-sair" type="submit">Sair</button>
      </form>
    </nav>
  </header>
  {% if flash %}
  <p class="aviso" role="status">{{ flash }}</p>
  {% endif %}
  <main>
    {% block conteudo %}{% endblock %}
  </main>
</body>
</html>
